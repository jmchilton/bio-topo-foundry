# Pure-Python noarch. Modeled on `rattler-build generate-recipe pypi kmapper`.
context:
  build_number: '0'

package:
  name: kmapper
  version: 2.1.0

source:
- url: https://files.pythonhosted.org/packages/db/1f/142bb0c049239d6d35997909a219d22b1ee456091523bf2ef289083595ea/kmapper-2.1.0.tar.gz
  sha256: d78df18e176b2ef21edf0ea9f815bae1bf277e7b3a805b76bd1263fbcd05e3a3

build:
  number: ${{ build_number }}
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python >=3.6
  - pip
  - setuptools
  run:
  - python >=3.6
  - scikit-learn
  - numpy
  - scipy
  - jinja2

tests:
- python:
    imports:
    - kmapper

about:
  homepage: https://kepler-mapper.scikit-tda.org
  summary: Python implementation of the Mapper algorithm for Topological Data Analysis
  license: MIT
  repository: https://github.com/scikit-tda/kepler-mapper
