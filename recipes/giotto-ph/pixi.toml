# Adapter only: points pixi-build at the rattler-build recipe beside it. recipe.yaml is the
# artifact — the thing that eventually becomes a conda-forge/Bioconda staged-recipes PR.
[package]
name = "giotto-ph"
version = "0.2.4"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
