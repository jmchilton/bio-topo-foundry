# pixi-build adapter for the in-repo pyDowker recipe. See recipe.yaml. Consumed as a path dependency.
[package]
name = "pydowker"
version = "0.0.1"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }

[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
preview = ["pixi-build"]
