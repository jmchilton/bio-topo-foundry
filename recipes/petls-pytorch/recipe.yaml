# petls-pytorch — GPU-native Persistent Topological Laplacians in PyTorch (S. K. Marston / Sylverity,
# 2026). An INDEPENDENT PyTorch reimplementation of the PETLS persistent-Laplacian engine, written from
# the PETLS paper + public API (not petls source). Apache-2.0 + pure-Python universal wheel → noarch:
# python and conda-forge/Bioconda-eligible — unlike upstream petls (unlicensed, compiled, linux-64-only,
# permanently capped at L1). This is the "harden an existing open package" alternative to a from-scratch
# cleanroom (see ../../persistent-laplacian-implementation-review.md; bio-topo-foundry#2, now superseded).
#
# BUILT FROM OUR FORK jmchilton/petls-pytorch @ v2 (git_commit below), NOT the PyPI 1.0.2 sdist. v2 bundles
# three fixes on top of upstream 1.0.2: (1) simplex-tree boundary extraction now indexes every simplex, so
# isolated vertices no longer crash Complex(simplex_tree=)/Rips(distances=) — REQUIRED for the bipartite
# interface complexes in the TopoDockQ featurizer (bio-topo-foundry#3); (2) tadasets demoted from a runtime
# dep to a benchmark extra upstream-in-fork; (3) added float64 property tests. pyproject version stays 1.0.2
# (static, no setuptools_scm) so the built package reports 1.0.2; build_number distinguishes it. Each fix is
# also its own pushed branch; upstream PRs pending. VERIFIED GREEN via `rattler-build build` (sibling
# ../tadasets recipe no longer needed by THIS env — see run-deps).
# RUN-DEPS: pytorch/numpy/scipy/gudhi are the core; matplotlib + pandas are genuine (used in
# core/profile.py + utils/plotting.py). `tadasets` is NO LONGER a runtime dep in the fork (it moved to the
# `benchmark` optional-dependencies group), so it is dropped from `run` here and pip-check stays clean.
context:
  version: "1.0.2"
  build_number: '1'
  git_commit: 25364f5a3dada72cdf6aa7ac363ca8b189752c2f

package:
  name: petls-pytorch
  version: ${{ version }}

source:
- url: https://github.com/jmchilton/petls-pytorch/archive/${{ git_commit }}.tar.gz
  sha256: 76ad891cbc7ee852f69cda93e3b0aa897b941e872d0195900c433dcb5dbba5fa

build:
  number: ${{ build_number }}
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python >=3.10
  - pip
  - setuptools >=61.0
  - wheel
  run:
  - python >=3.10
  - pytorch >=2.0.0
  - numpy >=1.24.0
  - scipy >=1.10.0
  - gudhi >=3.10.0
  - pandas >=2.0.0
  - matplotlib-base >=3.7.0

tests:
- python:
    imports:
    - petls_pytorch
    pip_check: true

about:
  homepage: https://github.com/Sylverity/petls-pytorch
  summary: GPU-native persistent topological Laplacians in PyTorch (independent PETLS reimplementation)
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  repository: https://github.com/jmchilton/petls-pytorch
