# scvi-tools — deep generative (variational) single-cell embedding. TopoMetry's learned-embedding
# baseline / comparator: the neural latent space you benchmark a topological scaffold against.
# conda-forge → L3 (noarch python; pulls a torch/jax/lightning closure, all conda-forge).
# NOTE: bioconda also carries `scvi-tools` but pinned to an ancient 0.14.5; conda-forge is current
# (1.5.0.post1) and authoritative — channel order below keeps conda-forge first for that reason.
# (conda-forge scvi-tools=1.5.0.post1, 2026-07-30)
[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
scvi-tools = "==1.5.0.post1"
