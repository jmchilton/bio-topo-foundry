# package (CLI) → L4 (auto BioContainer). (Bioconda mmseqs2=18.8cc5c, 2026-07-30)
[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
mmseqs2 = "==18.8cc5c"
