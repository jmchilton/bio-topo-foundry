# ripser.py — "A Lean Persistent Homology Library for Python" (Python bindings), distinct
# from the same-named Bioconda C++ CLI in ../ripser-cpp. conda-forge only, single package.
# conda-forge single packages get no automatic BioContainer, so this grades L3 unless the exact
# target string is registered in BioContainers hash.tsv. (conda-forge ripser=0.6.14, 2026-07-29)
[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
ripser = "==0.6.14"

