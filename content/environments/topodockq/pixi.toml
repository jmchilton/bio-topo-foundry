# TopoDockQ (scorer) — persistent-combinatorial-Laplacian peptide-protein docking confidence
# (Dai, Wang & Zhang, NYU). Repo github.com/XDaiNYU/TopoDockQ @ 5696f82e148fc4a2eb07962d5bbc333d06d76a74.
#
# LICENSE: MIT (in-repo LICENSE) -> redistributable in principle, so L3-eligible *later*.
#
# WHY L0 (not L1) TODAY: the core is shipped as Python-3.8 .pyc BYTECODE with no source
# (src/get_PHcomplex.pyc, get_MLfeature.pyc, read_pdb.pyc, get_PHinputs.pyc, main.pyc) and there is no
# setup.py/pyproject -> nothing to build a recipe from, and the interpreter is HARD-PINNED to CPython
# 3.8 (bytecode is version-locked; it will not import on any other Python). The separate unlicensed
# featurizer (wangru25/TopoDockQ-Feature) is EXCLUDED; the scorer runs inference on SUPPLIED features.
#
# This fixture mirrors the upstream environment.yaml verbatim (conda base + pip layer). RUN the .pyc
# scripts from the pinned clone (e.g. `python 02_tutorial_inference.py`), not as an installed package.
[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.8.18"
numpy = "<=1.24.3"
pandas = "<=2.2.0"
scikit-learn = "1.3.0"
gudhi = "3.8.0"

[pypi-dependencies]
torch = ">=2.0.0"
torchvision = "*"
matplotlib = ">=3.5.0"
scipy = ">=1.9.0"
pillow = ">=8.0.0"
