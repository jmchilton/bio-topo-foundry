# Ripser (C++ CLI) — efficient Vietoris–Rips persistence barcodes.
# Single Bioconda package; BioContainers image observed at quay → L4 (digest in index.md).
# NAME COLLISION: conda-forge also ships a `ripser` (the 0.6.x Python lib). Pinning ==1.0.1
# disambiguates to the Bioconda C++ tool. The channel prefix is part of the mulled identity —
# see ../ripser-py. (verified on anaconda.org 2026-07-29)
[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
ripser = "==1.0.1"

